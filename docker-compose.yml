services:
  db:
    image: postgres:16-alpine
    container_name: astromaniaka-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: astro
      POSTGRES_PASSWORD: astro
      POSTGRES_DB: astromaniaka
      TZ: America/Sao_Paulo
    ports:
      # 5432 já está em uso pelo Postgres local, por isso 5433 no host
      - "5433:5432"
    volumes:
      - astro_pgdata:/var/lib/postgresql/data
      # Executados em ordem alfabética só na primeira inicialização (volume vazio)
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U astro -d astromaniaka"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  astro_pgdata:
